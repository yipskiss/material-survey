<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="재질 평가">
<title>재질 시각 평가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style id="css">
:root{
  --ground:#F2F2F1; --surface:#FFFFFF; --ink:#191A1B; --muted:#6E7176;
  --line:#DEDFE0; --soft:#ECEDED; --accent:#6E6E6E; --accent-on:#FFFFFF;
  --ok:#2C7A57; --ok-soft:#E3EFE9; --warn-bg:#F5EEDC; --warn-ink:#6C5619;
  --danger:#9E3B2F; --shadow:0 1px 3px rgba(20,22,23,.07),0 8px 24px rgba(20,22,23,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#131415; --surface:#1C1E20; --ink:#EBECEC; --muted:#979A9F;
    --line:#2D3033; --soft:#24272A; --accent:#A8A8A8; --accent-on:#1A1A1A;
    --ok:#62BD93; --ok-soft:#1E2E27; --warn-bg:#312D1D; --warn-ink:#D8C070;
    --danger:#D4796C; --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#131415; --surface:#1C1E20; --ink:#EBECEC; --muted:#979A9F;
  --line:#2D3033; --soft:#24272A; --accent:#A8A8A8; --accent-on:#1A1A1A;
  --ok:#62BD93; --ok-soft:#1E2E27; --warn-bg:#312D1D; --warn-ink:#D8C070;
  --danger:#D4796C; --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ground); color:var(--ink);
  font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:16px; line-height:1.55; min-height:100vh;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.wrap{max-width:660px;margin:0 auto;padding:24px 18px 64px}
.wrap.wide{max-width:960px}
.eyebrow{font-size:12px;font-weight:500;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin-top:6px}
.sub{color:var(--muted);margin-top:8px;font-size:14.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.banner{border-radius:10px;padding:10px 14px;font-size:13.5px;background:var(--warn-bg);color:var(--warn-ink);margin-bottom:16px}
.banner.okb{background:var(--ok-soft);color:var(--ok)}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:18px 0 10px;font-size:13.5px;color:var(--muted)}
.stats b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:14px}
.pbtn{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 8px 10px;text-align:center;transition:border-color .12s}
.pbtn:hover{border-color:var(--accent)}
.pbtn .pid{font-weight:600;font-size:15px}
.pbtn .st{display:block;font-size:11.5px;margin-top:3px;color:var(--muted);font-variant-numeric:tabular-nums}
.pbtn.part .st{color:var(--accent);font-weight:500}
.pbtn.done{background:var(--ok-soft);border-color:transparent}
.pbtn.done .st{color:var(--ok);font-weight:500}
.foot{margin-top:26px;display:flex;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:13px 22px;font-size:15.5px;font-weight:500;background:var(--accent);color:var(--accent-on);min-height:48px;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:none;color:var(--muted);border:1px solid var(--line)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.btnrow{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.center{text-align:center}
.trialnum{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.codechip{display:inline-block;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:40px;letter-spacing:.02em;background:var(--soft);border-radius:14px;padding:14px 30px;margin:14px 0 6px}
.codesub{color:var(--muted);font-size:14.5px}
button.codechip{cursor:pointer}
.codechip.masked{font-size:17px;font-weight:500;font-family:inherit;color:var(--muted);background:none;border:1.5px dashed var(--line);padding:22px 34px}
.guide{list-style:none;margin-top:12px;display:grid;gap:10px}
.guide li{padding-left:20px;position:relative;font-size:14.5px}
.guide li::before{content:"";position:absolute;left:2px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.topbar{position:sticky;top:0;z-index:5;background:var(--ground);padding:12px 0 10px;margin-bottom:6px}
.topline{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:var(--muted)}
.topline b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:2px;background:var(--soft);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .2s}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.btn:active{transform:none}}
.hint{font-size:13.5px;color:var(--muted);margin:10px 0 4px}
.sect{margin-top:20px}
.sectlab{font-size:12px;font-weight:500;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}
.items{margin-top:14px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 16px 16px;margin-bottom:10px}
.item.miss{border-color:var(--danger)}
.poles{display:flex;justify-content:space-between;gap:12px;font-size:18px;font-weight:500}
.poles .r{text-align:right}
.q{font-size:18px;font-weight:500;line-height:1.5}
.anchors{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:12px;padding:0 4px}
.dots7 .dot{width:40px;height:40px;font-size:13px}
.dots7 .dotrow{max-width:440px}
.dots7 .dotrow::before{left:20px;right:20px}
body.big-dots .dots7 .dot{width:48px;height:48px;font-size:14px}
.choicerow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.choice{flex:1;min-width:88px;border:1.5px solid var(--line);border-radius:10px;padding:13px 10px;font-size:15.5px;color:var(--muted);text-align:center}
.choice[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-on);font-weight:600}
.etcin{width:100%;margin-top:12px;font:inherit;font-size:15px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.etcin::placeholder{color:var(--muted);opacity:.7}
.breaktime{font-family:'IBM Plex Mono',monospace;font-size:52px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:22px}
.dots{display:flex;justify-content:center;margin-top:14px}
.dotrow{position:relative;display:flex;flex:1 1 auto;max-width:400px;justify-content:space-between}
.dotrow::before{content:"";position:absolute;top:50%;left:23px;right:23px;height:1.5px;background:var(--line);transform:translateY(-50%)}
.dot{position:relative;background:var(--surface);width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;transition:background .1s,border-color .1s}
.dot:hover{border-color:var(--accent)}
.dot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-on);font-weight:600}
.missnote{color:var(--danger);font-size:13.5px;margin:4px 0 10px;display:none}
.missnote.show{display:block}
.donemark{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.eyeicon{display:flex;justify-content:center;color:var(--muted)}
.vwrap{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding-top:24px;padding-bottom:32px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:2px 10px;background:var(--soft);color:var(--muted)}
.tag.done{background:var(--ok-soft);color:var(--ok)}
.tag.part{background:var(--soft);color:var(--accent);font-weight:500}
.del{color:var(--danger);font-size:13px;border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.del.arm{background:var(--danger);border-color:var(--danger);color:#fff}
.admhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 14px}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:16px}
.note b{color:var(--ink)}
.backlink{font-size:14px;color:var(--muted);display:inline-block;margin-bottom:12px}
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 30%,transparent);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal .box{background:var(--surface);border-radius:14px;padding:20px;max-width:640px;width:100%;box-shadow:var(--shadow)}
.modal textarea{width:100%;height:240px;margin:12px 0;font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
body.big-text{font-size:17.5px}
body.big-dots .dot{width:58px;height:58px;font-size:16px}
body.big-dots .dotrow{max-width:460px}
body.big-dots .dotrow::before{left:29px;right:29px}
@media (max-width:420px){body.big-dots .dot{width:50px;height:50px}}
.btn.ghost[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.toolrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
select.psel{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.frm .full{grid-column:1/-1}
.frm label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.frm input,.frm select{width:100%;font:inherit;font-size:14px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.ordergrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-top:10px}
.ocell{border:1px solid var(--line);border-radius:8px;padding:17px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--surface);width:100%;position:relative}
.ocell.odone{opacity:.4}
.ocell.ochk{border-color:var(--accent)}
.ocell.onext{border:2px solid var(--accent)}
.ocell.odelarm{opacity:1;border:2px solid var(--danger)}
.omark{position:absolute;top:3px;right:6px;color:var(--accent);font-weight:600;font-size:12px}
.onum{position:absolute;top:3px;left:6px;color:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}
.ocat{font-size:11px;color:var(--muted)}
.ocode{font-size:13.5px;font-weight:600}
</style>
</head>

var serverPay=null,payFetchState=null; // null | 'loading' | 'ok' | 'err' | 'badkey'
function fetchPayList(){
  if(!ENDPOINT||!adminKey)return Promise.resolve(false);
  payFetchState='loading';
  return post({action:'listinfo',key:adminKey}).then(function(res){
    if(res&&res.ok){
      serverPay=res.list||[];payFetchState='ok';
      var ids={};serverPay.forEach(function(p){ids[p.id]=true;});
      var ch=false;
      payInfo.forEach(function(p){if(p.id&&ids[p.id]&&!p.synced){p.synced=true;ch=true;}});
      if(ch)savePay();
      render();return true;
    }
    payFetchState=(res&&res.error==='bad_admin_key')?'badkey':'err';render();return false;
  },function(){payFetchState='err';render();return false;});
}
function syncPay(){
  if(!ENDPOINT)return Promise.resolve(false);
  var pending=payInfo.filter(function(p){return !p.synced;});
  var chain=Promise.resolve();
  pending.forEach(function(p){
    chain=chain.then(function(){
      return post({action:'addinfo',info:p}).then(function(res){
        if(res&&res.ok){p.synced=true;savePay();}
      },function(){});
    });
  });
  return chain.then(function(){return adminKey?fetchPayList():(render(),true);});
}
function mergedPay(){
  if(serverPay===null)return payInfo.slice();
  var ids={};serverPay.forEach(function(p){ids[p.id]=true;});
  return serverPay.map(function(p){var q={};for(var k in p)q[k]=p[k];q._srv=true;return q;})

function post(body){
  if(!body.key)body.key=APIKEY;
  return fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'})
    .then(function(r){return r.json();});
}
var flushing=false;
function flush(){
  if(!ENDPOINT||!queue.length||flushing)return Promise.resolve(false);
  flushing=true;
  var batch=queue.slice(0,80);
  return post({records:batch}).then(function(res){
    flushing=false;
    if(res&&res.ok){
      batch.forEach(function(rec){
        var m=serverAnswered[rec.pid]=serverAnswered[rec.pid]||{};
        m[rec.trial-1]=true;
      });
      queue=queue.slice(batch.length);saveQueue();
      serverOk=true;render();
      if(queue.length)return flush();
      return true;
    }
    serverOk=false;render();return false;
  },function(){flushing=false;serverOk=false;render();return false;});
}
function refresh(){
  if(!ENDPOINT)return Promise.resolve(false);
  return fetch(ENDPOINT,{redirect:'follow'}).then(function(r){return r.json();}).then(function(res){
    if(res&&res.ok){
      serverAnswered={};
      for(var pid in (res.answered||{})){
        if(!ORDERS[pid])continue;
        var m=serverAnswered[pid]={};
        res.answered[pid].forEach(function(tr){if(tr>=1&&tr<=40)m[tr-1]=true;});
      }
      // 서버에서 삭제된 기록을 이 기기에도 반영:
      // 전송이 끝났고(대기열에 없음) 서버에도 없는 로컬 기록은 관리자가 지운 것이므로 제거
      var changed=false;
      for(var rp in records){
        for(var rk in records[rp]){
          var tr2=(+rk)+1;
          var inQ=queue.some(function(r){return r.pid===rp&&r.trial===tr2;});
          var onSrv=serverAnswered[rp]&&serverAnswered[rp][rk];
          if(!inQ&&!onSrv){delete records[rp][rk];changed=true;}
        }
        if(!Object.keys(records[rp]).length)delete records[rp];
      }
      if(changed)saveRecords();
      serverOk=true;render();return true;
    }
    serverOk=false;render();return false;
  },function(){serverOk=false;render();return false;});
}

function payCSV(mask){
  function esc(s){return '"'+String(s==null?'':s).replace(/"/g,'""')+'"';}
  // 엑셀이 앞자리 0을 지우거나 지수 표기로 바꾸지 못하게 텍스트로 강제 (전화번호·주민번호·계좌번호)
  function esct(s){return '="'+String(s==null?'':s).replace(/"/g,'""')+'"';}
  var list=mergedPay(),lines;
  if(mask){
    // 증빙용: 제출 서류 양식 (주민번호 마스킹, 계좌정보 합침)
    lines=['연번,성명,주민번호,소속,직위,활용일시,연락처,주소,청구금액,계좌정보'];
    list.forEach(function(p,i){
      var acct=[p.bank,p.holder,p.acct].filter(Boolean).join(', ');
      lines.push([i+1,esc(p.name),esct(maskRRN(p.rrn)),esc(p.org),esc(p.pos),esc(p.dt),esct(p.phone),esc(p.addr),esc(p.amt),esc(acct)].join(','));
    });
  }else{
    // 수기입력용: 청구 시스템 화면의 입력 순서 그대로 (예금주 → 은행 → 계좌번호 분리)
    lines=['연번,성명,주민등록번호,소속,직위,활용일시,연락처,주소,청구금액,예금주,은행,계좌번호'];
    list.forEach(function(p,i){
      lines.push([i+1,esc(p.name),esct(p.rrn),esc(p.org),esc(p.pos),esc(p.dt),esct(p.phone),esc(p.addr),esc(p.amt),esc(p.holder),esc(p.bank),esct(p.acct)].join(','));
    });
  }
  return '﻿'+lines.join('\r\n');
}

      +PIDS.map(function(p){return '<option value="'+p+'">'+p+'</option>';}).join('')
      +'</select><button class="btn ghost" data-act="bulk">이 피험자 남은 재료 전부 랜덤 입력</button></div>'
      +'<p class="hint">테스트 모드: 시편 준비 화면에 ◀/▶ 이동·랜덤 저장 버튼, 평가 화면에 랜덤 입력(R 키)이 생깁니다. 테스트 후 해당 피험자를 초기화하고 테스트 모드를 꺼 주세요.</p>'):'')
    +'</div>'
    +'<div class="note"><b>데이터 원본은 구글 시트입니다.</b> 분석용 전체 데이터는 시트에서 파일 → 다운로드 → Excel(.xlsx)로 받으세요. 여기 CSV 버튼은 이 기기에서 기록된 분량만 내보냅니다.</div>'
    +'<div class="note"><b>제시 순서: 순환 라틴 스퀘어</b> — P01은 무작위 기준 순서, P02부터는 앞 피험자에서 한 칸씩 밀린 순서입니다. 시편을 P01 순서로 줄 세워두면, 다음 피험자는 시작 지점만 한 칸 뒤로 옮기면 됩니다 (끝나면 처음으로 순환). 40명 전체로 보면 모든 재질이 모든 위치에 정확히 한 번씩 제시됩니다.</div>'
    +'<div class="note">피험자 초기화는 구글 시트와 이 기기에서 해당 피험자의 응답을 모두 삭제합니다. 버튼을 두 번 눌러야 실행됩니다.</div>'
    +'</div>';
  if(orderShown&&ORDERS[orderShown])renderOrderBox(orderShown);
}

function buildCSV(){
  var head=['participant','trial','material','category'];
  for(var i=0;i<ITEMS.length;i++)head.push(ITEMS[i].key);
  head.push('timestamp');
  var lines=[head.join(',')];
  for(var p=0;p<PIDS.length;p++){
    var pid=PIDS[p],r=records[pid]||{};
    for(var idx=0;idx<40;idx++){
      var rec=r[idx];if(!rec)continue;
      var row=[pid,idx+1,rec.m,rec.m.indexOf('PL_')===0?'plastic':'paper'];
      for(var q=0;q<ITEMS.length;q++)row.push(rec.r[q]);
      row.push(new Date(rec.t).toISOString());
      lines.push(row.join(','));
    }
  }
  return '﻿'+lines.join('\r\n');
}
function blobSave(name,data,type){
  var blob=new Blob([data],{type:type});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},2000);
}

var autoRun=false,autoTimer=null;
function draftComplete(){for(var i=0;i<ITEMS.length;i++){if(!itemOk(i,draft[i]))return false;}return true;}
function setAuto(on){
  autoRun=on;
  clearInterval(autoTimer);autoTimer=null;
  if(on)autoTimer=setInterval(autoStep,650);
  render();
}
function autoStep(){
  if(!settings.test||!autoRun){setAuto(false);return;}
  if(route.v==='prep'){var rb=app.querySelector('[data-act="rate"]');if(rb)rb.click();}
  else if(route.v==='rate'){
    if(!draftComplete()){draft=randomDraft();render();}
    else{var nb=app.querySelector('[data-act="next"]');if(nb)nb.click();}
  }
  else setAuto(false);
}
var armTimer=null;

app.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var act=b.dataset.act;if(!act)return;
  if(act==='home'){
    if(location.hash)history.replaceState(null,'',location.pathname+location.search);
    go({v:'home'});refresh();
  }
  else if(act==='pick'){
    var pid=b.dataset.pid;
    if(countOf(pid)>=40){go({v:'done',pid:pid});}
    else go({v:'start',pid:pid});
  }
  else if(act==='begin'){draft=[];go({v:'prep',pid:route.pid,idx:nextIdx(route.pid)});}
  else if(act==='tut'){draft=[];go({v:'tut',pid:route.pid});}
  else if(act==='tut-done'){draft=[];go({v:'start',pid:route.pid});}
  else if(act==='rate'){draft=[];go({v:'rate',pid:route.pid,idx:route.idx});}
  else if(act==='tbl-toggle'){adminTableOpen=!adminTableOpen;render();}
  else if(act==='showorder'){renderOrderBox(document.getElementById('orderpid').value);}
  else if(act==='odel'){
    var dp=b.dataset.pid,di=+b.dataset.idx,dk=dp+'#'+di;
    if(pendingDel!==dk){
      pendingDel=dk;clearTimeout(pendingDelTimer);
      pendingDelTimer=setTimeout(function(){pendingDel=null;if(route.v==='admin'&&orderShown===dp)renderOrderBox(dp);},3000);
      renderOrderBox(dp);return;
    }
    pendingDel=null;clearTimeout(pendingDelTimer);
    if(records[dp]){delete records[dp][di];if(!Object.keys(records[dp]).length)delete records[dp];saveRecords();}
    queue=queue.filter(function(r){return !(r.pid===dp&&r.trial===di+1);});saveQueue();
    if(serverAnswered[dp])delete serverAnswered[dp][di];
    renderOrderBox(dp);
    if(ENDPOINT){post({action:'deltrial',pid:dp,trial:di+1}).then(function(){refresh();},function(){serverOk=false;render();});}
  }
  else if(act==='dot'){
    var i=+b.dataset.item,val=+b.dataset.val;
    draft[i]=val;
    var row=app.querySelector('[data-row="'+i+'"]');
    row.classList.remove('miss');
    var dots=row.querySelectorAll('.dot');
    for(var d=0;d<dots.length;d++)dots[d].setAttribute('aria-pressed',dots[d]===b?'true':'false');
  }
  else if(act==='choice'){
    var chI=+b.dataset.item;
    draft[chI]=b.dataset.val;
    var chRow=app.querySelector('[data-row="'+chI+'"]');
    chRow.classList.remove('miss');
    var chBs=chRow.querySelectorAll('.choice');
    for(var chK=0;chK<chBs.length;chK++)chBs[chK].setAttribute('aria-pressed',chBs[chK]===b?'true':'false');
    var etcEl=document.getElementById('etc'+chI);
    if(etcEl){
      etcEl.hidden=(b.dataset.val!=='기타');
      if(!etcEl.hidden)etcEl.focus();
    }
  }
  else if(act==='next'){
    var missing=-1;
    for(var q=0;q<ITEMS.length;q++){
      var ok=itemOk(q,draft[q]);
      var rw=app.querySelector('[data-row="'+q+'"]');
      rw.classList.toggle('miss',!ok);
      if(!ok&&missing<0)missing=q;
    }
    if(missing>=0){
      document.getElementById('missnote').classList.add('show');
      app.querySelector('[data-row="'+missing+'"]').scrollIntoView({block:'center'});
      return;
    }
    var pid2=route.pid,idx2=route.idx;
    var out=draft.slice(0,ITEMS.length);
    for(var oi=0;oi<ITEMS.length;oi++){
      if(ITEMS[oi].t==='choice'&&out[oi]==='기타'){
        var et=document.getElementById('etc'+oi);
        if(et&&et.value.trim())out[oi]='기타('+et.value.trim().replace(/[\r\n,]+/g,' ')+')';
      }
    }
    saveRecord(pid2,idx2,out);
    saveRecords();saveQueue();
    draft=[];
    var nx2=nextIdx(pid2);
    go(nx2>=40?{v:'done',pid:pid2}:{v:'prep',pid:pid2,idx:nx2});
    flush();
  }
  else if(act==='tprev'){if(route.idx>0){setRoute({v:'prep',pid:route.pid,idx:route.idx-1});render();}}
  else if(act==='tnext'){if(route.idx<39){setRoute({v:'prep',pid:route.pid,idx:route.idx+1});render();}}
  else if(act==='trand'){
    var tp=route.pid,ti=route.idx;
    if(!answeredSet(tp)[ti]){saveRecord(tp,ti,randomDraft());saveRecords();saveQueue();flush();}
    var tn=nextIdx(tp);
    go(tn>=40?{v:'done',pid:tp}:{v:'prep',pid:tp,idx:tn});
  }
  else if(act==='rand'){draft=randomDraft();render();}
  else if(act==='stepauto'){
    if(route.v==='rate'){
      draft=randomDraft();
      var snb=app.querySelector('[data-act="next"]');
      render();
      snb=app.querySelector('[data-act="next"]');if(snb)snb.click();
    }
  }
  else if(act==='auto'){setAuto(!autoRun);}
  else if(act==='tg-test'){settings.test=!settings.test;saveSettings();render();}
  else if(act==='tg-text'){settings.bigText=!settings.bigText;saveSettings();applySettings();render();}
  else if(act==='tg-dots'){settings.bigDots=!settings.bigDots;saveSettings();applySettings();render();}
  else if(act==='bulk'){
    var sel=document.getElementById('bulkpid');if(!sel)return;
    var bp=sel.value;
    if(!b.classList.contains('arm')){
      b.classList.add('arm');b.style.color='var(--danger)';b.textContent=bp+' 40개 채우기 — 한 번 더 누르면 실행';
      clearTimeout(armTimer);
      armTimer=setTimeout(function(){b.classList.remove('arm');b.style.color='';b.textContent='이 피험자 남은 재료 전부 랜덤 입력';},3000);
      return;
    }
    clearTimeout(armTimer);
    var s=answeredSet(bp),added=0;
    for(var bi=0;bi<40;bi++){if(!s[bi]){saveRecord(bp,bi,randomDraft());added++;}}
    if(added){saveRecords();saveQueue();flush();}
    render();
  }
  else if(act==='del'){
    var pid3=b.dataset.pid;
    if(!b.classList.contains('arm')){
      b.classList.add('arm');b.textContent='정말 삭제?';
      clearTimeout(armTimer);
      armTimer=setTimeout(function(){b.classList.remove('arm');b.textContent='초기화';},3000);
      return;
    }
    clearTimeout(armTimer);
    delete records[pid3];saveRecords();
    delete serverAnswered[pid3];
    queue=queue.filter(function(r){return r.pid!==pid3;});saveQueue();
    if(ENDPOINT){post({action:'reset',pid:pid3}).then(function(){refresh();},function(){serverOk=false;render();});}
    render();
  }
  else if(act==='info-save'){
    function gv(id){var el=document.getElementById(id);return el?(el.value||'').trim():'';}
    if(!gv('pi_name')){document.getElementById('infomsg').textContent='성명을 입력해 주세요.';return;}
    var agreeEl=document.getElementById('pi_agree');
    if(agreeEl&&!agreeEl.checked){document.getElementById('infomsg').textContent='개인정보 수집·이용 동의에 체크해 주세요.';return;}
    payInfo.push({id:newPayId(),synced:false,client:deviceId,pid:gv('pi_pid'),name:gv('pi_name'),rrn:gv('pi_rrn'),org:gv('pi_org'),pos:gv('pi_pos'),dt:composeDt('pi'),phone:gv('pi_phone'),addr:gv('pi_addr'),amt:gv('pi_amt'),bank:gv('pi_bank'),holder:gv('pi_holder'),acct:gv('pi_acct'),agree:'Y',agreedAt:new Date().toISOString(),t:Date.now()});
    savePay();syncPay();infoSaved=true;render();window.scrollTo(0,0);
  }
  else if(act==='info-new'){infoSaved=false;pendingInfoPid=null;render();window.scrollTo(0,0);}
  else if(act==='goinfo'){
    pendingInfoPid=route.pid;infoSaved=false;
    location.hash='#info';
  }
  else if(act==='info-back'){
    var backPid=pendingInfoPid;pendingInfoPid=null;
    if(location.hash)history.replaceState(null,'',location.pathname+location.search);
    go(backPid?{v:'start',pid:backPid}:{v:'home'});
  }
  else if(act==='redo'){
    var bIdx2=+b.dataset.idx,rp=route.pid;
    if(!b.classList.contains('arm')){
      b.classList.add('arm');b.textContent='한 번 더 누르면 '+(bIdx2+1)+'번째 재료를 다시 평가합니다';
      clearTimeout(armTimer);
      armTimer=setTimeout(function(){b.classList.remove('arm');b.textContent='↩ 이전 재료('+(bIdx2+1)+'번째) 다시 평가';},3000);
      return;
    }
    clearTimeout(armTimer);
    if(records[rp])delete records[rp][bIdx2];
    saveRecords();
    queue=queue.filter(function(r){return !(r.pid===rp&&r.trial===bIdx2+1);});saveQueue();
    if(serverAnswered[rp])delete serverAnswered[rp][bIdx2];
    try{
      var rd2=JSON.parse(localStorage.getItem('mtgh_redo_v1')||'{}');
      rd2[rp+'#'+bIdx2]=true;localStorage.setItem('mtgh_redo_v1',JSON.stringify(rd2));
    }catch(e){}
    draft=[];
    go({v:'prep',pid:rp,idx:bIdx2});
  }
  else if(act==='pay-open'){showPayModal();}
  else if(act==='akey-save'){
    var akin=document.getElementById('akey_in');
    if(akin&&akin.value.trim()){setAdminKey(akin.value.trim());payFetchState=null;syncPay();render();}
  }
  else if(act==='akey-reset'){setAdminKey('');serverPay=null;payFetchState=null;render();}
  else if(act==='pay-refresh'){syncPay();}
  else if(act==='pay-del'){
    var delId=b.dataset.id;
    if(!b.classList.contains('arm')){
      b.classList.add('arm');b.textContent='정말 삭제?';
      clearTimeout(armTimer);
      armTimer=setTimeout(function(){b.classList.remove('arm');b.textContent='삭제';},3000);
      return;
    }
    clearTimeout(armTimer);
    payInfo=payInfo.filter(function(p){return p.id!==delId;});savePay();
    var onServer=serverPay&&serverPay.some(function(p){return p.id===delId;});
    if(onServer&&adminKey){post({action:'delinfo',key:adminKey,id:delId}).then(fetchPayList,function(){render();});}
    else render();
  }
  else if(act==='pay-csv-full'){blobSave('참여비지급정보_수기입력용.csv',payCSV(false),'text/csv;charset=utf-8');}
  else if(act==='pay-csv-mask'){blobSave('참여비지급정보_증빙용.csv',payCSV(true),'text/csv;charset=utf-8');}
  else if(act==='pay-json'){blobSave('참여비지급정보_백업.json',JSON.stringify({pay:mergedPay()}),'application/json');}
  else if(act==='pay-import'){showPayImportModal();}
  else if(act==='pay-clear'){
    if(!b.classList.contains('arm')){
      b.classList.add('arm');b.textContent='정말 전체 삭제?';
      clearTimeout(armTimer);
      armTimer=setTimeout(function(){b.classList.remove('arm');b.textContent='전체 삭제';},3000);
      return;
    }
    clearTimeout(armTimer);
    payInfo=[];savePay();
    if(adminKey){post({action:'clearinfo',key:adminKey}).then(function(){serverPay=[];render();},function(){render();});}
    else render();
  }
  else if(act==='csv'){blobSave('재질평가_이기기기록.csv',buildCSV(),'text/csv;charset=utf-8');}
  else if(act==='refresh'){refresh();}
  else if(act==='retry'){flush();}
});

document.addEventListener('keydown',function(e){
  if(!settings.test)return;
  if(e.target&&/^(input|textarea|select)$/i.test(e.target.tagName))return;
  if(e.key==='g'||e.key==='G'){
    if(route.v==='rate'||route.v==='prep'){e.preventDefault();setAuto(!autoRun);}
    return;
  }
  if(route.v==='rate'){
    if(e.key==='r'||e.key==='R'){draft=randomDraft();render();}
    else if(e.key===' '){
      e.preventDefault();
      draft=randomDraft();render();
      var sb=app.querySelector('[data-act="next"]');if(sb)sb.click();
    }
    else if(e.key==='Enter'){var nb=app.querySelector('[data-act="next"]');if(nb)nb.click();}
  }else if(route.v==='prep'){
    if(e.key==='ArrowLeft'){var pb=app.querySelector('[data-act="tprev"]');if(pb)pb.click();}
    else if(e.key==='ArrowRight'){var xb=app.querySelector('[data-act="tnext"]');if(xb)xb.click();}
    else if(e.key===' '){e.preventDefault();var rb=app.querySelector('[data-act="rate"]');if(rb)rb.click();}
  }
});

window.addEventListener('hashchange',function(){
  if(location.hash==='#admin'){go({v:'admin'});refresh();syncPay();}
  else if(location.hash==='#info'){infoSaved=false;go({v:'info'});}
  else if(route.v==='admin'||route.v==='info'){go({v:'home'});}
});
window.addEventListener('storage',function(e){
  if(e.key===LS_PAY){
    try{payInfo=JSON.parse(localStorage.getItem(LS_PAY)||'[]')||[];}catch(err){}
    if(route.v==='admin')render();
  }
});

if('serviceWorker' in navigator){
  try{navigator.serviceWorker.register('sw.js');}catch(e){}
}

applySettings();
if(location.hash==='#admin')route={v:'admin'};
else if(location.hash==='#info')route={v:'info'};
else if(route.v==='admin'||route.v==='info')route={v:'home'};
sanitizeRoute();
render();
refresh().then(function(){sanitizeRoute();render();if(queue.length)flush();});
if(route.v==='admin')syncPay();
})();
</script>
