<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>재질 시각 평가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style id="css">
:root{
  --ground:#F2F2F1; --surface:#FFFFFF; --ink:#191A1B; --muted:#6E7176;
  --line:#DEDFE0; --soft:#ECEDED; --accent:#33474F; --accent-on:#FFFFFF;
  --ok:#2C7A57; --ok-soft:#E3EFE9; --warn-bg:#F5EEDC; --warn-ink:#6C5619;
  --danger:#9E3B2F; --shadow:0 1px 3px rgba(20,22,23,.07),0 8px 24px rgba(20,22,23,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#131415; --surface:#1C1E20; --ink:#EBECEC; --muted:#979A9F;
    --line:#2D3033; --soft:#24272A; --accent:#AFC3CB; --accent-on:#16272D;
    --ok:#62BD93; --ok-soft:#1E2E27; --warn-bg:#312D1D; --warn-ink:#D8C070;
    --danger:#D4796C; --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#131415; --surface:#1C1E20; --ink:#EBECEC; --muted:#979A9F;
  --line:#2D3033; --soft:#24272A; --accent:#AFC3CB; --accent-on:#16272D;
  --ok:#62BD93; --ok-soft:#1E2E27; --warn-bg:#312D1D; --warn-ink:#D8C070;
  --danger:#D4796C; --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ground); color:var(--ink);
  font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  font-size:16px; line-height:1.55; min-height:100vh;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.wrap{max-width:660px;margin:0 auto;padding:24px 18px 64px}
.wrap.wide{max-width:960px}
.eyebrow{font-size:12px;font-weight:500;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
h1{font-size:26px;font-weight:700;letter-spacing:-.01em;text-wrap:balance;margin-top:6px}
.sub{color:var(--muted);margin-top:8px;font-size:14.5px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.banner{border-radius:10px;padding:10px 14px;font-size:13.5px;background:var(--warn-bg);color:var(--warn-ink);margin-bottom:16px}
.banner.okb{background:var(--ok-soft);color:var(--ok)}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:18px 0 10px;font-size:13.5px;color:var(--muted)}
.stats b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:14px}
.pbtn{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 8px 10px;text-align:center;transition:border-color .12s}
.pbtn:hover{border-color:var(--accent)}
.pbtn .pid{font-weight:600;font-size:15px}
.pbtn .st{display:block;font-size:11.5px;margin-top:3px;color:var(--muted);font-variant-numeric:tabular-nums}
.pbtn.part .st{color:var(--accent);font-weight:500}
.pbtn.done{background:var(--ok-soft);border-color:transparent}
.pbtn.done .st{color:var(--ok);font-weight:500}
.foot{margin-top:26px;display:flex;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:13px 22px;font-size:15.5px;font-weight:500;background:var(--accent);color:var(--accent-on);min-height:48px;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:none;color:var(--muted);border:1px solid var(--line)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.btnrow{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.center{text-align:center}
.trialnum{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.codechip{display:inline-block;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:40px;letter-spacing:.02em;background:var(--soft);border-radius:14px;padding:14px 30px;margin:14px 0 6px}
.codesub{color:var(--muted);font-size:14.5px}
button.codechip{cursor:pointer}
.codechip.masked{font-size:17px;font-weight:500;font-family:inherit;color:var(--muted);background:none;border:1.5px dashed var(--line);padding:22px 34px}
.guide{list-style:none;margin-top:12px;display:grid;gap:10px}
.guide li{padding-left:20px;position:relative;font-size:14.5px}
.guide li::before{content:"";position:absolute;left:2px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.topbar{position:sticky;top:0;z-index:5;background:var(--ground);padding:12px 0 10px;margin-bottom:6px}
.topline{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:var(--muted)}
.topline b{color:var(--ink);font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:2px;background:var(--soft);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .2s}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.btn:active{transform:none}}
.hint{font-size:13.5px;color:var(--muted);margin:10px 0 4px}
.sect{margin-top:20px}
.sectlab{font-size:12px;font-weight:500;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 16px;margin-bottom:10px}
.item.miss{border-color:var(--danger)}
.poles{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;font-weight:500}
.poles .r{text-align:right}
.dots{display:flex;justify-content:space-between;margin-top:12px;padding:0 2px}
.dot{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center;transition:background .1s,border-color .1s}
.dot:hover{border-color:var(--accent)}
.dot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-on);font-weight:600}
.missnote{color:var(--danger);font-size:13.5px;margin:4px 0 10px;display:none}
.missnote.show{display:block}
.donemark{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);font-size:30px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tscroll{overflow-x:auto}
.tag{display:inline-block;font-size:12px;border-radius:999px;padding:2px 10px;background:var(--soft);color:var(--muted)}
.tag.done{background:var(--ok-soft);color:var(--ok)}
.tag.part{background:var(--soft);color:var(--accent);font-weight:500}
.del{color:var(--danger);font-size:13px;border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.del.arm{background:var(--danger);border-color:var(--danger);color:#fff}
.admhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 14px}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:16px}
.note b{color:var(--ink)}
.backlink{font-size:14px;color:var(--muted);display:inline-block;margin-bottom:12px}
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 30%,transparent);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal .box{background:var(--surface);border-radius:14px;padding:20px;max-width:640px;width:100%;box-shadow:var(--shadow)}
.modal textarea{width:100%;height:240px;margin:12px 0;font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
body.big-text{font-size:17.5px}
body.big-dots .dot{width:58px;height:58px;font-size:16px}
.btn.ghost[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.toolrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
select.psel{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.ordergrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;margin-top:10px}
.ocell{border:1px solid var(--line);border-radius:8px;padding:8px 9px;font-size:13px;display:flex;gap:7px;align-items:baseline;background:var(--surface);text-align:left;width:100%}
.ocell.odone{opacity:.4}
.ocell.ochk{border-color:var(--accent)}
.omark{color:var(--accent);font-weight:600;margin-left:auto}
.onum{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;min-width:16px}
</style>
</head>

function saveRecord(pid,idx,ratings){
  var m=ORDERS[pid][idx],now=Date.now();
  (records[pid]=records[pid]||{})[idx]={m:m,r:ratings,t:now};
  queue.push({pid:pid,trial:idx+1,material:m,category:m.indexOf('PL_')===0?'plastic':'paper',
    ratings:ratings,timestamp:new Date(now).toISOString(),client:deviceId+(settings.test?'-test':'')});
}

function answeredSet(pid){
  var s={},k;
  var sv=serverAnswered[pid]||{};for(k in sv)s[k]=true;
  var lc=records[pid]||{};for(k in lc)s[k]=true;
  return s;
}
function countOf(pid){return Object.keys(answeredSet(pid)).length;}
function nextIdx(pid){var s=answeredSet(pid);for(var i=0;i<40;i++){if(!s[i])return i;}return 40;}
function totalCount(){var n=0;for(var i=0;i<PIDS.length;i++)n+=countOf(PIDS[i]);return n;}
function matName(m){return m.indexOf('PL_')===0?('재활용 플라스틱 '+m.slice(3)+'번'):('종이 '+m.slice(2)+'번');}

function post(body){
  body.key=APIKEY;
  return fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),redirect:'follow'})
    .then(function(r){return r.json();});
}
var flushing=false;
function flush(){
  if(!ENDPOINT||!queue.length||flushing)return Promise.resolve(false);
  flushing=true;
  var batch=queue.slice(0,80);
  return post({records:batch}).then(function(res){
    flushing=false;
    if(res&&res.ok){
      batch.forEach(function(rec){
        var m=serverAnswered[rec.pid]=serverAnswered[rec.pid]||{};
        m[rec.trial-1]=true;
      });
      queue=queue.slice(batch.length);saveQueue();
      serverOk=true;render();
      if(queue.length)return flush();
      return true;
    }
    serverOk=false;render();return false;
  },function(){flushing=false;serverOk=false;render();return false;});
}
function refresh(){
  if(!ENDPOINT)return Promise.resolve(false);
  return fetch(ENDPOINT,{redirect:'follow'}).then(function(r){return r.json();}).then(function(res){
    if(res&&res.ok){
      serverAnswered={};
      for(var pid in (res.answered||{})){
        if(!ORDERS[pid])continue;
        var m=serverAnswered[pid]={};
        res.answered[pid].forEach(function(tr){if(tr>=1&&tr<=40)m[tr-1]=true;});
      }
      serverOk=true;render();return true;
    }
    serverOk=false;render();return false;
  },function(){serverOk=false;render();return false;});
}
setInterval(function(){if(queue.length)flush();},30000);
window.addEventListener('online',function(){if(queue.length)flush();});

function go(r){setRoute(r);render();window.scrollTo(0,0);}
function sanitizeRoute(){
  if((route.v==='prep'||route.v==='rate'||route.v==='start'||route.v==='done')&&!ORDERS[route.pid]){route={v:'home'};return;}
  if(route.v==='prep'||route.v==='rate'){
    var n=nextIdx(route.pid);
    if(n>=40){route={v:'done',pid:route.pid};}
    else if(route.idx===undefined||route.idx<n){route={v:'prep',pid:route.pid,idx:n};}
  }
}

  if(!ENDPOINT)return '<div class="banner">구글 시트 연결 전 — index.html 상단의 ENDPOINT에 Apps Script 웹 앱 URL을 넣어야 서버 저장이 됩니다. 지금은 이 기기에만 저장돼요.</div>';
  if(queue.length)return '<div class="banner">서버 전송 대기 '+queue.length+'건 — 응답은 이 기기에 보관 중이고, 연결되면 자동으로 전송됩니다.</div>';
  if(serverOk===false)return '<div class="banner">구글 시트 연결 확인 실패 — 인터넷/배포 설정을 확인하세요. 응답은 이 기기에 저장되고 있습니다.</div>';
  return '';
}

function render(){
  var v=route.v;
  if(v==='start')renderStart();
  else if(v==='prep')renderPrep();
  else if(v==='rate')renderRate();
  else if(v==='done')renderDone();
  else if(v==='admin')renderAdmin();
  else renderHome();
}

function renderHome(){
  var doneN=0,partN=0,cells='';
  for(var i=0;i<PIDS.length;i++){
    var pid=PIDS[i],c=countOf(pid);
    var cls='pbtn',st='시작 전';
    if(c>=40){cls+=' done';st='완료';doneN++;}
    else if(c>0){cls+=' part';st=c+' / 40';partN++;}
    cells+='<button class="'+cls+'" data-act="pick" data-pid="'+pid+'"><span class="pid mono">'+pid+'</span><span class="st">'+st+'</span></button>';
  }
  app.innerHTML='<div class="wrap">'+bannerHTML()
    +'<p class="eyebrow">사전 자극물 선정 · 라이트 박스 실험</p>'
    +'<h1>재질 시각 평가</h1>'
    +'<p class="sub">재활용 플라스틱 20종 · 종이 20종 — 피험자를 선택하면 지정된 순서로 평가가 진행됩니다.</p>'
    +'<div class="stats"><span>완료 <b>'+doneN+'</b>명</span><span>진행 중 <b>'+partN+'</b>명</span><span>누적 응답 <b>'+totalCount()+'</b> / '+TOTAL+'</span></div>'
    +'<div class="pgrid">'+cells+'</div>'
    +'</div>';
}

function renderStart(){
  var pid=route.pid,c=countOf(pid);
  var resume=c>0&&c<40;
  app.innerHTML='<div class="wrap">'+bannerHTML()
    +'<button class="backlink" data-act="home">← 피험자 선택</button>'
    +'<div class="card center">'
    +'<p class="eyebrow">피험자</p>'
    +'<div class="codechip">'+pid+'</div>'
    +'<p class="codesub">'+(resume?('지금까지 '+c+' / 40개 완료 — 이어서 진행합니다'):'새 세션 · 재료 40개')+'</p>'
    +'</div>'
    +'<div class="card" style="margin-top:14px">'
    +'<p class="sectlab">평가 안내</p><ul class="guide">'
    +'<li>눈으로만(시각) 판단합니다. 시편을 손으로 만지지 않습니다.</li>'
    +'<li>재료 40개가 정해진 순서로 제시되며, 재료마다 같은 9개 문항에 응답합니다.</li>'
    +'<li>각 문항은 두 표현 사이 5점 척도입니다. 가까운 쪽에 표시해 주세요.</li>'
    +'<li>정답은 없습니다. 보이는 인상 그대로 응답하면 됩니다.</li>'
    +'</ul></div>'
    +'<div class="btnrow"><button class="btn wide" data-act="begin">'+(resume?'이어서 시작':'평가 시작')+'</button></div>'
    +'</div>';
}

function renderPrep(){
  app.innerHTML='<div class="wrap center" style="padding-top:96px">'+bannerHTML()
    +'<h1 style="font-size:22px;font-weight:600">잠시만 기다려 주세요</h1>'
    +'<p class="sub">진행자의 안내에 따라 진행됩니다.</p>'
    +'<div class="btnrow" style="margin-top:56px"><button class="btn wide" data-act="rate">평가 시작</button></div>'
    +(settings.test?('<div class="toolrow" style="justify-content:center"><button class="btn ghost" data-act="tprev">◀ 이전 (←)</button>'
      +'<button class="btn ghost" data-act="tnext">다음 (→)</button>'
      +'<button class="btn ghost" data-act="trand">랜덤 저장 후 다음</button></div>'):'')
    +'<p style="margin-top:64px"><button class="backlink" data-act="home">세션 나가기</button></p>'
    +'<p class="mono" style="font-size:11px;color:var(--muted);opacity:.55;margin-top:8px">'+route.pid+' · '+(route.idx+1)+' / 40</p>'
    +'</div>';
}

function renderRate(){
  var pid=route.pid,idx=route.idx;
  var doneCnt=countOf(pid);
  var rows='',lastSect='';
  for(var i=0;i<ITEMS.length;i++){
    var it=ITEMS[i];
    if(it.s!==lastSect){
      if(lastSect)rows+='</div>';
      rows+='<div class="sect"><p class="sectlab">'+SECTIONS[it.s]+'</p>';
      lastSect=it.s;
    }
    var dots='';
    for(var v=1;v<=5;v++){
      dots+='<button class="dot" data-act="dot" data-item="'+i+'" data-val="'+v+'" aria-pressed="'+(draft[i]===v?'true':'false')+'">'+v+'</button>';
    }
    rows+='<div class="item" data-row="'+i+'"><div class="poles"><span>'+it.l+'</span><span class="r">'+it.r+'</span></div><div class="dots">'+dots+'</div></div>';
  }
  rows+='</div>';
  var last=idx>=39;
  app.innerHTML='<div class="wrap">'
    +'<div class="topbar"><div class="topline"><span class="mono">'+pid+'</span><span>재료 <b>'+(idx+1)+'</b> / 40</span></div>'
    +'<div class="bar"><i style="width:'+Math.round(doneCnt/40*100)+'%"></i></div></div>'
    +bannerHTML()
    +'<p class="hint">시편을 눈으로만 보고, 각 문항에서 두 표현 중 가까운 쪽에 표시해 주세요. (3 = 중간)</p>'
    +rows
    +'<p class="missnote" id="missnote">아직 응답하지 않은 문항이 있습니다.</p>'
    +(settings.test?'<div class="toolrow"><button class="btn ghost" data-act="rand">랜덤 입력 (R)</button></div>':'')
    +'<div class="btnrow"><button class="btn wide" data-act="next">'+(last?'평가 완료 · 저장':'다음 재료 · 저장')+'</button></div>'
    +'</div>';
}

function renderDone(){
  var pid=route.pid;
  app.innerHTML='<div class="wrap center" style="padding-top:60px">'+bannerHTML()
    +'<div class="card" style="padding:36px 24px">'
    +'<div class="donemark">✓</div>'
    +'<h1 style="font-size:22px">'+pid+' 세션 완료</h1>'
    +'<p class="sub">재료 40개 평가가 모두 기록되었습니다.<br>참여해 주셔서 감사합니다.</p>'
    +'</div>'
    +'<div class="btnrow"><button class="btn wide" data-act="home">피험자 선택으로</button></div>'
    +'</div>';
}

function renderOrderBox(op){
  var os=answeredSet(op),ck=checks[op]||{},oh='<div class="ordergrid">';
  ORDERS[op].forEach(function(m,i){
    oh+='<button class="ocell'+(os[i]?' odone':'')+(ck[i]?' ochk':'')+'" data-act="ocell" data-pid="'+op+'" data-idx="'+i+'">'
      +'<span class="onum">'+(i+1)+'</span><span class="mono">'+m+'</span>'+(ck[i]?'<span class="omark">✓</span>':'')+'</button>';
  });
  oh+='</div>';
  document.getElementById('orderbox').innerHTML=
    '<p class="hint">'+op+' 제시 순서 — 흐린 항목은 응답이 저장된 재료, 칸을 탭하면 진행자 체크(✓)를 켜고 끌 수 있어요 (이 기기에만 저장되는 메모, 실험 데이터와 무관).</p>'
    +oh
    +'<div class="toolrow"><button class="btn ghost" data-act="clearchk" data-pid="'+op+'">'+op+' 체크 모두 지우기</button></div>';
}
function renderAdmin(){
  var rows='';
  for(var i=0;i<PIDS.length;i++){
    var pid=PIDS[i],c=countOf(pid);
    var lc=records[pid]||{},lastT=0,k;
    for(k in lc){if(lc[k].t>lastT)lastT=lc[k].t;}
    var tag=c>=40?'<span class="tag done">완료</span>':(c>0?'<span class="tag part">진행 중</span>':'<span class="tag">시작 전</span>');
    var d=lastT?new Date(lastT):null;
    function z(n){return (n<10?'0':'')+n;}
    var tstr=d?(d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes())):'—';
    rows+='<tr><td class="mono">'+pid+'</td><td>'+tag+'</td><td>'+c+' / 40</td><td>'+tstr+'</td>'
      +'<td>'+(c>0?'<button class="del" data-act="del" data-pid="'+pid+'">초기화</button>':'')+'</td></tr>';
  }
  var sheetBtn=SHEET_URL?'<a class="btn" href="'+SHEET_URL+'" target="_blank" rel="noopener">구글 시트 열기</a>':'';
  var syncLabel=serverOk===true?'시트 연결됨':(serverOk===false?'시트 연결 안 됨':'확인 중');
  app.innerHTML='<div class="wrap wide">'+bannerHTML()
    +'<button class="backlink" data-act="home">← 홈으로</button>'
    +'<div class="admhead"><div><p class="eyebrow">기록 관리 · '+syncLabel+'</p><h1 style="font-size:22px">응답 현황 <span class="mono" style="font-weight:500;font-size:16px;color:var(--muted)">'+totalCount()+' / '+TOTAL+'</span></h1></div>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap">'+sheetBtn
    +'<button class="btn ghost" data-act="refresh">새로고침</button>'
    +'<button class="btn ghost" data-act="retry">대기분 전송'+(queue.length?(' ('+queue.length+')'):'')+'</button>'
    +'<button class="btn ghost" data-act="csv">CSV (이 기기 기록)</button></div></div>'
    +'<div class="card tscroll" style="padding:6px 14px"><table><thead><tr><th>피험자</th><th>상태</th><th>응답</th><th>이 기기 마지막 저장</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    +'<div class="card" style="margin-top:16px"><p class="sectlab">제시 순서표 (진행자용)</p>'
    +'<div class="toolrow" style="align-items:center"><select class="psel" id="orderpid">'
    +PIDS.map(function(p){return '<option value="'+p+'">'+p+'</option>';}).join('')
    +'</select><button class="btn ghost" data-act="showorder">순서 보기</button></div>'
    +'<div id="orderbox"></div></div>'
    +'<div class="card" style="margin-top:16px"><p class="sectlab">화면 · 테스트 설정</p>'
    +'<div class="toolrow">'
    +'<button class="btn ghost" data-act="tg-test" aria-pressed="'+settings.test+'">테스트 모드 '+(settings.test?'켜짐':'꺼짐')+'</button>'
    +'<button class="btn ghost" data-act="tg-text" aria-pressed="'+settings.bigText+'">큰 글자 '+(settings.bigText?'켜짐':'꺼짐')+'</button>'
    +'<button class="btn ghost" data-act="tg-dots" aria-pressed="'+settings.bigDots+'">큰 응답 버튼 '+(settings.bigDots?'켜짐':'꺼짐')+'</button>'
    +'</div>'
    +(settings.test?('<div class="toolrow" style="align-items:center"><select class="psel" id="bulkpid">'
      +PIDS.map(function(p){return '<option value="'+p+'">'+p+'</option>';}).join('')
      +'</select><button class="btn ghost" data-act="bulk">이 피험자 남은 재료 전부 랜덤 입력</button></div>'
      +'<p class="hint">테스트 모드: 시편 준비 화면에 ◀/▶ 이동·랜덤 저장 버튼, 평가 화면에 랜덤 입력(R 키)이 생깁니다. 테스트 후 해당 피험자를 초기화하고 테스트 모드를 꺼 주세요.</p>'):'')
    +'</div>'
    +'<div class="note"><b>데이터 원본은 구글 시트입니다.</b> 분석용 전체 데이터는 시트에서 파일 → 다운로드 → Excel(.xlsx)로 받으세요. 여기 CSV 버튼은 이 기기에서 기록된 분량만 내보냅니다.</div>'
    +'<div class="note"><b>제시 순서 자동 보정 안내</b> — 원본 순서 파일의 중복·누락 3건 보정: P06 39번째 P_10→P_18 · P29 27번째 PL_9→PL_20 · P31 35번째 PL_7→PL_17.</div>'
    +'<div class="note">피험자 초기화는 구글 시트와 이 기기에서 해당 피험자의 응답을 모두 삭제합니다. 버튼을 두 번 눌러야 실행됩니다.</div>'
    +'</div>';
}

function buildCSV(){
  var head=['participant','trial','material','category'];
  for(var i=0;i<ITEMS.length;i++)head.push('q'+(i+1)+'_'+ITEMS[i].l.replace(/\s/g,'')+'-'+ITEMS[i].r.replace(/\s/g,''));
  head.push('timestamp');
  var lines=[head.join(',')];
  for(var p=0;p<PIDS.length;p++){
    var pid=PIDS[p],r=records[pid]||{};
    for(var idx=0;idx<40;idx++){
      var rec=r[idx];if(!rec)continue;
      var row=[pid,idx+1,rec.m,rec.m.indexOf('PL_')===0?'plastic':'paper'];
      for(var q=0;q<ITEMS.length;q++)row.push(rec.r[q]);
      row.push(new Date(rec.t).toISOString());
      lines.push(row.join(','));
    }
  }
  return '﻿'+lines.join('\r\n');
}
function blobSave(name,data,type){
  var blob=new Blob([data],{type:type});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},2000);
}

var armTimer=null;

app.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var act=b.dataset.act;if(!act)return;
  if(act==='home'){
    if(location.hash)history.replaceState(null,'',location.pathname+location.search);
    go({v:'home'});refresh();
  }
  else if(act==='pick'){
    var pid=b.dataset.pid;
    if(countOf(pid)>=40){go({v:'done',pid:pid});}
    else go({v:'start',pid:pid});
  }
  else if(act==='begin'){draft=[];go({v:'prep',pid:route.pid,idx:nextIdx(route.pid)});}
  else if(act==='rate'){draft=[];go({v:'rate',pid:route.pid,idx:route.idx});}
  else if(act==='showorder'){renderOrderBox(document.getElementById('orderpid').value);}
  else if(act==='ocell'){
    var cp=b.dataset.pid,ci=+b.dataset.idx;
    var cm=checks[cp]=checks[cp]||{};
    if(cm[ci])delete cm[ci];else cm[ci]=true;
    if(!Object.keys(cm).length)delete checks[cp];
    saveChecks();renderOrderBox(cp);
  }
  else if(act==='clearchk'){delete checks[b.dataset.pid];saveChecks();renderOrderBox(b.dataset.pid);}
  else if(act==='dot'){
    var i=+b.dataset.item,val=+b.dataset.val;
    draft[i]=val;
    var row=app.querySelector('[data-row="'+i+'"]');
    row.classList.remove('miss');
    var dots=row.querySelectorAll('.dot');
    for(var d=0;d<dots.length;d++)dots[d].setAttribute('aria-pressed',dots[d]===b?'true':'false');
  }
  else if(act==='next'){
    var missing=-1;
    for(var q=0;q<ITEMS.length;q++){
      var ok=draft[q]>=1&&draft[q]<=5;
      var rw=app.querySelector('[data-row="'+q+'"]');
      rw.classList.toggle('miss',!ok);
      if(!ok&&missing<0)missing=q;
    }
    if(missing>=0){
      document.getElementById('missnote').classList.add('show');
      app.querySelector('[data-row="'+missing+'"]').scrollIntoView({block:'center'});
      return;
    }
    var pid2=route.pid,idx2=route.idx;
    saveRecord(pid2,idx2,draft.slice(0,9));
    saveRecords();saveQueue();
    draft=[];
    go(idx2+1>=40?{v:'done',pid:pid2}:{v:'prep',pid:pid2,idx:idx2+1});
    flush();
  }
  else if(act==='tprev'){if(route.idx>0){setRoute({v:'prep',pid:route.pid,idx:route.idx-1});render();}}
  else if(act==='tnext'){if(route.idx<39){setRoute({v:'prep',pid:route.pid,idx:route.idx+1});render();}}
  else if(act==='trand'){
    var tp=route.pid,ti=route.idx;
    if(!answeredSet(tp)[ti]){saveRecord(tp,ti,randomDraft());saveRecords();saveQueue();flush();}
    go(ti+1>=40?{v:'done',pid:tp}:{v:'prep',pid:tp,idx:ti+1});
  }
  else if(act==='rand'){draft=randomDraft();render();}
  else if(act==='tg-test'){settings.test=!settings.test;saveSettings();render();}
  else if(act==='tg-text'){settings.bigText=!settings.bigText;saveSettings();applySettings();render();}
  else if(act==='tg-dots'){settings.bigDots=!settings.bigDots;saveSettings();applySettings();render();}
  else if(act==='bulk'){
    var sel=document.getElementById('bulkpid');if(!sel)return;
    var bp=sel.value;
    if(!b.classList.contains('arm')){
      b.classList.add('arm');b.style.color='var(--danger)';b.textContent=bp+' 40개 채우기 — 한 번 더 누르면 실행';
      clearTimeout(armTimer);
      armTimer=setTimeout(function(){b.classList.remove('arm');b.style.color='';b.textContent='이 피험자 남은 재료 전부 랜덤 입력';},3000);
      return;
    }
    clearTimeout(armTimer);
    var s=answeredSet(bp),added=0;
    for(var bi=0;bi<40;bi++){if(!s[bi]){saveRecord(bp,bi,randomDraft());added++;}}
    if(added){saveRecords();saveQueue();flush();}
    render();
  }
  else if(act==='del'){
    var pid3=b.dataset.pid;
    if(!b.classList.contains('arm')){
      b.classList.add('arm');b.textContent='정말 삭제?';
      clearTimeout(armTimer);
      armTimer=setTimeout(function(){b.classList.remove('arm');b.textContent='초기화';},3000);
      return;
    }
    clearTimeout(armTimer);
    delete records[pid3];saveRecords();
    delete serverAnswered[pid3];
    queue=queue.filter(function(r){return r.pid!==pid3;});saveQueue();
    if(ENDPOINT){post({action:'reset',pid:pid3}).then(function(){refresh();},function(){serverOk=false;render();});}
    render();
  }
  else if(act==='csv'){blobSave('재질평가_이기기기록.csv',buildCSV(),'text/csv;charset=utf-8');}
  else if(act==='refresh'){refresh();}
  else if(act==='retry'){flush();}
});

document.addEventListener('keydown',function(e){
  if(!settings.test)return;
  if(e.target&&/^(input|textarea|select)$/i.test(e.target.tagName))return;
  if(route.v==='rate'){
    if(e.key==='r'||e.key==='R'){draft=randomDraft();render();}
    else if(e.key==='Enter'){var nb=app.querySelector('[data-act="next"]');if(nb)nb.click();}
  }else if(route.v==='prep'){
    if(e.key==='ArrowLeft'){var pb=app.querySelector('[data-act="tprev"]');if(pb)pb.click();}
    else if(e.key==='ArrowRight'){var xb=app.querySelector('[data-act="tnext"]');if(xb)xb.click();}
  }
});

window.addEventListener('hashchange',function(){
  if(location.hash==='#admin'){go({v:'admin'});refresh();}
  else if(route.v==='admin'){go({v:'home'});}
});

applySettings();
if(location.hash==='#admin')route={v:'admin'};
else if(route.v==='admin')route={v:'home'};
sanitizeRoute();
render();
refresh().then(function(){sanitizeRoute();render();if(queue.length)flush();});
})();
</script>
